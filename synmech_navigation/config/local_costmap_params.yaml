local_costmap:
  global_frame: odom # Local Coordination
  robot_base_frame: base_footprint
  update_frequency: 5.0 # Update like lidar
  publish_frequency: 2.0
  static_map: false # skip global map
  rolling_window: true # virtual map pinned with robot
  width: 3.0 # width of scanned map
  height: 3.0 # height of scanned map
  resolution: 0.05