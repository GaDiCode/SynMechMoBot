TrajectoryPlannerROS:
  max_vel_x: 0.4
  min_vel_x: 0.1
  max_vel_theta: 1.0
  min_in_air_vel_theta: -1.0
  min_vel_theta: -1.0

  acc_lim_x: 1.0
  acc_lim_theta: 2.0

  holonomic_robot: false

  yaw_goal_tolerance: 0.15
  xy_goal_tolerance: 0.10
  latch_xy_goal_tolerance: true

  sim_time: 1.5
  vx_samples: 6
  vtheta_samples: 20