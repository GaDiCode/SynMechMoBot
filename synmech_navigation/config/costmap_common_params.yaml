# ver 1 square robot:
footprint: [[-0.10, -0.10], [-0.10, 0.10], [0.10, 0.10], [0.10, -0.10]]

# ver2 circle robot will use:
#robot_radius: 0.1

inflation_radius: 0.30
cost_scaling_factor: 3.0

observation_sources: laser_scan_sensor

laser_scan_sensor: {
  sensor_frame: laser_frame,
  data_type: LaserScan,
  topic: /scan,
  marking: true, # Mark obstacle
  clearing: true # Clear obstacle after disappear
}